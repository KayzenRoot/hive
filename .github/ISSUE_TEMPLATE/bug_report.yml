name: Bug report
description: Report a reproducible defect in HIVE.
title: "[Bug]: "
labels:
  - type:bug
body:
  - type: markdown
    attributes:
      value: Remove secrets and personal data before submitting logs.
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Give the smallest reproducible sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Docker version, commit, and relevant configuration.
    validations:
      required: true
