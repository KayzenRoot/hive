name: Bug report
description: Report a reproducible defect in HIVE.
title: "[Bug]: "
labels:
  - type:bug
body:
  - type: markdown
    attributes:
      value: Remove secrets and personal data before submitting logs. A reproducible defect may receive a governed Work Order after triage.
  - type: input
    id: work_order
    attributes:
      label: Work Order ID
      description: Use an existing ID or write NEEDS TRIAGE; do not invent canonical status.
      placeholder: ENG-PROTOCOL-ADOPTION-001 or NEEDS TRIAGE
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Give the smallest reproducible sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Docker version, commit, and relevant configuration.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and scope
      description: Include logs without secrets, baseline commit, affected paths, and whether the issue may involve dynamic configuration, jobs, migrations, or public contracts.
    validations:
      required: true
