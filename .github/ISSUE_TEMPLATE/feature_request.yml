name: Feature request
description: Propose a scoped, evidence-based improvement.
title: "[Feature]: "
labels:
  - type:feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Describe the smallest useful outcome and its boundaries.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope classification
      description: Which release class would this change belong to?
      options:
        - "1.0.x patch - backward-compatible fix or bounded operational improvement"
        - "1.x.0 minor - backward-compatible capability"
        - "2.0.0 major - breaking public contract change"
        - Unsure - needs triage
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility
      description: API, schema, migration or operational compatibility impact.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence
      description: How should success be verified deterministically?
    validations:
      required: true
