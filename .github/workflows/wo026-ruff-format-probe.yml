name: WO026 Ruff Format Probe

on:
  push:
    branches:
      - wo-026/apache-2-oss-readiness

permissions:
  contents: read

jobs:
  format_probe:
    name: Ruff format probe
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install exact Ruff
        run: python -m pip install ruff==0.9.4
      - name: Print formatter diff
        run: python -m ruff format --diff --config pyproject.toml scripts/review_evidence.py backend/tests/test_review_evidence.py
