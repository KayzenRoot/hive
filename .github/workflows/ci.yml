name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install backend tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Run deterministic validation
        run: python scripts/validate.py
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hive-validation-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: tmp/validation
          if-no-files-found: warn

  integration:
    name: Integration health
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install integration test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Start HIVE services
        run: docker compose up -d --build
      - name: Run container smoke test
        run: |
          set -o pipefail
          mkdir -p tmp/integration-logs
          python scripts/integration_health.py 2>&1 | tee tmp/integration-logs/integration-health.log
      - name: Run Project Registry real-Git integration test
        run: |
          set -o pipefail
          mkdir -p tmp/integration-logs
          python scripts/project_registry_integration.py 2>&1 | tee tmp/integration-logs/project-registry.log
      - name: Run Repository Indexing real-Git integration test
        run: |
          set -o pipefail
          mkdir -p tmp/integration-logs
          python scripts/repository_indexing_integration.py 2>&1 | tee tmp/integration-logs/repository-indexing.log
      - name: Run Task Intake and CAS integration test
        run: |
          set -o pipefail
          mkdir -p tmp/integration-logs
          python scripts/task_intake_integration.py 2>&1 | tee tmp/integration-logs/task-intake.log
      - name: Run Retrieval Corpus and Lexical integration test
        run: |
          set -o pipefail
          mkdir -p tmp/integration-logs
          python scripts/retrieval_integration.py 2>&1 | tee tmp/integration-logs/retrieval.log
      - name: Collect bounded service logs
        if: always()
        run: docker compose logs --no-color --tail=200
      - name: Upload validation and integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hive-integration-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            tmp/validation
            tmp/integration-logs
          if-no-files-found: warn
      - name: Stop services without deleting data
        if: always()
        run: docker compose down --remove-orphans

  review_evidence:
    name: Review Evidence
    if: github.event_name == 'pull_request'
    needs: [validate, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install evidence tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Download Validate evidence
        uses: actions/download-artifact@v4
        with:
          name: hive-validation-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: tmp/validation
      - name: Download Integration evidence
        uses: actions/download-artifact@v4
        with:
          name: hive-integration-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: tmp
      - name: Enforce Draft pull request
        env:
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [[ "$PR_DRAFT" != "true" ]]; then
            echo "Review Evidence requires the pull request to remain Draft."
            exit 1
          fi
      - name: Generate Review Evidence manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/review_evidence.py \
            --work-order WO-006 \
            --repository "${{ github.repository }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --draft \
            --base-branch "${{ github.event.pull_request.base.ref }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-branch "${{ github.event.pull_request.head.ref }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --artifact-name "hive-review-evidence-WO-006-${{ github.event.pull_request.head.sha }}" \
            --server-url "$GITHUB_SERVER_URL" \
            --run-id "$GITHUB_RUN_ID" \
            --integration-status PASS
      - name: Upload Review Evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hive-review-evidence-WO-006-${{ github.event.pull_request.head.sha }}
          path: |
            tmp/review-evidence
            tmp/validation/retrieval-benchmark.json
          if-no-files-found: warn
      - name: Update sticky Review Evidence comment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker='<!-- hive-review-evidence:WO-006 -->'
          body="$(printf '%s\n\n' "$marker"; cat tmp/review-evidence/review-summary.md; printf '\nWorkflow run: %s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          comment_id="$(gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --jq '.[] | select(.body | contains("hive-review-evidence:WO-006")) | .id' | tail -n 1)"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi
