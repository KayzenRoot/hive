name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install backend tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Run deterministic validation
        run: python scripts/validate.py

  integration:
    name: Integration health
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install integration test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Start HIVE services
        run: docker compose up -d --build
      - name: Run container smoke test
        run: python scripts/integration_health.py
      - name: Run Project Registry real-Git integration test
        run: python scripts/project_registry_integration.py
      - name: Run Repository Indexing real-Git integration test
        run: python scripts/repository_indexing_integration.py
      - name: Run Task Intake and CAS integration test
        run: python scripts/task_intake_integration.py
      - name: Collect service logs
        if: always()
        run: docker compose logs
      - name: Stop services without deleting data
        if: always()
        run: docker compose down --remove-orphans
