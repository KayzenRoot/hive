name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install backend tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Run deterministic validation
        run: python scripts/validate.py
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hive-validation-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: tmp/validation
          if-no-files-found: warn

  integration:
    name: Integration health
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install integration test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Start HIVE services
        run: docker compose up -d --build
      - name: Run container smoke test
        run: |
          set -o pipefail
          mkdir -p tmp/integration-logs
          python scripts/integration_health.py 2>&1 | tee tmp/integration-logs/integration-health.log
      - name: Run Project Registry real-Git integration test
        run: |
          set -o pipefail
          mkdir -p tmp/integration-logs
          python scripts/project_registry_integration.py 2>&1 | tee tmp/integration-logs/project-registry.log
      - name: Run Repository Indexing real-Git integration test
        run: |
          set -o pipefail
          mkdir -p tmp/integration-logs
          python scripts/repository_indexing_integration.py 2>&1 | tee tmp/integration-logs/repository-indexing.log
      - name: Run Task Intake and CAS integration test
        run: |
          set -o pipefail
          mkdir -p tmp/integration-logs
          python scripts/task_intake_integration.py 2>&1 | tee tmp/integration-logs/task-intake.log
      - name: Run Retrieval Corpus, Semantic, and Hybrid integration test
        run: |
          set -o pipefail
          mkdir -p tmp/integration-logs
          python scripts/retrieval_integration.py 2>&1 | tee tmp/integration-logs/retrieval.log
      - name: Run Context Manager integration test
        run: |
          set -o pipefail
          mkdir -p tmp/integration-logs
          python scripts/context_manager_integration.py 2>&1 | tee tmp/integration-logs/context-manager.log
      - name: Collect bounded service logs
        if: always()
        run: python scripts/capture_service_logs.py --output tmp/integration-logs/service-logs.log
      - name: Upload validation and integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hive-integration-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            tmp/validation
            tmp/integration-logs
          if-no-files-found: warn
      - name: Stop services without deleting data
        if: always()
        run: docker compose down --remove-orphans

  review_evidence:
    name: Review Evidence
    if: github.event_name == 'pull_request'
    needs: [validate, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install evidence tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Download Validate evidence
        uses: actions/download-artifact@v8
        with:
          name: hive-validation-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: tmp/validation
      - name: Download Integration evidence
        uses: actions/download-artifact@v8
        with:
          name: hive-integration-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: tmp
      - name: Resolve HIVE work-order marker
        id: work_order
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          work_order="$(python scripts/review_evidence.py \
            --resolve-work-order \
            --repository "$REPOSITORY" \
            --pr-number "$PR_NUMBER")"
          printf 'work_order=%s\n' "$work_order" >> "$GITHUB_OUTPUT"
      - name: Enforce Ready pull request
        env:
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [[ "$PR_DRAFT" == "true" ]]; then
            echo "Review Evidence requires the pull request to be Ready for review."
            exit 1
          fi
      - name: Verify user-owned native squash auto-merge before final evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python scripts/review_evidence.py \
            --verify-auto-merge \
            --repository "$REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --expected-head-sha "$EXPECTED_HEAD_SHA"
      - name: Generate Review Evidence manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/review_evidence.py \
            --repository "${{ github.repository }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --ready \
            --base-branch "${{ github.event.pull_request.base.ref }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-branch "${{ github.event.pull_request.head.ref }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --server-url "$GITHUB_SERVER_URL" \
            --run-id "$GITHUB_RUN_ID" \
            --integration-status PASS
      - name: Upload Review Evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hive-review-evidence-${{ steps.work_order.outputs.work_order }}-${{ github.event.pull_request.head.sha }}
          path: |
            tmp/review-evidence
            tmp/validation/retrieval-benchmark.json
          if-no-files-found: warn
      - name: Update sticky Review Evidence comment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          WORK_ORDER: ${{ steps.work_order.outputs.work_order }}
        run: |
          set -euo pipefail
          marker="<!-- hive-review-evidence:$WORK_ORDER -->"
          body="$(printf '%s\n\n' "$marker"; cat tmp/review-evidence/review-summary.md; printf '\nWorkflow run: %s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          comments="$(gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments")"
          current_ids="$(printf '%s' "$comments" | jq -r --arg marker "$marker" '.[] | select(.user.login == "github-actions[bot]" and (.body | contains($marker))) | .id')"
          comment_id="$(printf '%s\n' "$current_ids" | sed '/^$/d' | tail -n 1)"
          stale_id="$(printf '%s' "$comments" | jq -r --arg marker "$marker" --arg prefix '<!-- hive-review-evidence:' '.[] | select(.user.login == "github-actions[bot]" and (.body | contains($prefix)) and (.body | contains($marker) | not)) | .id' | tail -n 1)"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          elif [[ -n "$stale_id" ]]; then
            comment_id="$stale_id"
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi
          duplicate_ids="$(printf '%s' "$comments" | jq -r --arg marker "$marker" --arg canonical "$comment_id" '.[] | select(.user.login == "github-actions[bot]" and (.body | contains($marker)) and ((.id | tostring) != $canonical)) | .id')"
          old_ids="$(printf '%s' "$comments" | jq -r --arg marker "$marker" --arg prefix '<!-- hive-review-evidence:' '.[] | select(.user.login == "github-actions[bot]" and (.body | contains($prefix)) and (.body | contains($marker) | not)) | .id')"
          for stale in $duplicate_ids $old_ids; do
            [[ -z "$stale" || "$stale" == "$comment_id" ]] || gh api --method DELETE "repos/$REPOSITORY/issues/comments/$stale" >/dev/null
          done
