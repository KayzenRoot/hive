name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-and-release:
    name: Validate and publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify annotated tag identity and target
        shell: bash
        run: |
          set -euo pipefail
          tag_type="$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")"
          if [[ "$tag_type" != "tag" ]]; then
            echo "Release tags must be annotated; observed type: $tag_type"
            exit 1
          fi
          tag_target="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if [[ "$tag_target" != "$GITHUB_SHA" ]]; then
            echo "Tag target $tag_target does not match pushed commit $GITHUB_SHA"
            exit 1
          fi
      - name: Verify the tag commit is the accepted main release commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          main_sha="$(git rev-parse origin/main)"
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "Release tags must target the current accepted main commit."
            echo "tag commit:  $GITHUB_SHA"
            echo "origin/main: $main_sha"
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install backend tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Verify release metadata coherence
        run: python scripts/verify_release_metadata.py
      - name: Run deterministic validation
        run: python scripts/validate.py
      - name: Prepare isolated Compose roots
        env:
          HIVE_DATA_ROOT: ${{ github.workspace }}/.hive-wo031-data
          HIVE_PROJECTS_ROOT: ${{ github.workspace }}/.hive-wo031-projects
        run: mkdir -p "$HIVE_DATA_ROOT" "$HIVE_PROJECTS_ROOT"
      - name: Start services for release smoke test
        env:
          HIVE_DATA_ROOT: ${{ github.workspace }}/.hive-wo031-data
          HIVE_PROJECTS_ROOT: ${{ github.workspace }}/.hive-wo031-projects
          HIVE_AUTO_DISCOVERY_ENABLED: "false"
          HIVE_AUTO_DISCOVERY_INTERVAL_SECONDS: "10"
          HIVE_AUTO_DISCOVERY_MAX_PROJECTS: "20"
          HIVE_WO031_ISOLATED_E2E: "true"
        run: docker compose up -d --build
      - name: Run integration smoke test
        env:
          HIVE_DATA_ROOT: ${{ github.workspace }}/.hive-wo031-data
          HIVE_PROJECTS_ROOT: ${{ github.workspace }}/.hive-wo031-projects
          HIVE_AUTO_DISCOVERY_ENABLED: "true"
          HIVE_AUTO_DISCOVERY_INTERVAL_SECONDS: "10"
          HIVE_AUTO_DISCOVERY_MAX_PROJECTS: "20"
          HIVE_WO031_ISOLATED_E2E: "true"
        run: python scripts/integration_health.py
      - name: Stop services without deleting data
        if: always()
        env:
          HIVE_DATA_ROOT: ${{ github.workspace }}/.hive-wo031-data
          HIVE_PROJECTS_ROOT: ${{ github.workspace }}/.hive-wo031-projects
        run: docker compose down --remove-orphans
      - name: Prepare release package, checksum and manifest
        run: python scripts/prepare_release.py --tag "$GITHUB_REF_NAME" --ref "$GITHUB_SHA" --output-dir release-assets
      - name: Verify package checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check "hive-${GITHUB_REF_NAME}.zip.sha256"
      - name: Generate release review bundle
        run: python scripts/review_bundle.py --work-order RELEASE
      - name: Publish validated GitHub release
        shell: bash
        run: |
          set -euo pipefail
          prerelease_flag=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes_file"
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/hive-${GITHUB_REF_NAME}.zip" \
            "release-assets/hive-${GITHUB_REF_NAME}.zip.sha256" \
            "release-assets/hive-${GITHUB_REF_NAME}.manifest.json" \
            review-bundles/*.zip review-bundles/*.sha256 \
            --title "HIVE $GITHUB_REF_NAME" \
            --notes-file "$notes_file" \
            $prerelease_flag
