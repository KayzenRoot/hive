name: Temporary Ruff Formatter

on:
  push:
    branches:
      - fix/wo-031-progressive-disclosure-symbol-filter
    paths:
      - .github/workflows/temporary-ruff-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wo-031-progressive-disclosure-symbol-filter
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.9.4
      - run: python -m ruff format backend/app/progressive_disclosure.py
      - name: Commit formatter output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/progressive_disclosure.py
          git commit -m "style(context): apply exact Ruff 0.9.4 formatting"
          git push
