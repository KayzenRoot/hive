name: hive

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hive}
      POSTGRES_USER: ${POSTGRES_USER:-hive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hive}
    volumes:
      - ${HIVE_DATA_ROOT:-.hive-data}/postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hive} -d ${POSTGRES_DB:-hive}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - hive

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ${HIVE_DATA_ROOT:-.hive-data}/redis:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - hive

  migration:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-hive}:${POSTGRES_PASSWORD:-hive}@postgres:5432/${POSTGRES_DB:-hive}
    command: ["python", "scripts/migrate.py"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hive

  storage-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "root"
    environment:
      HIVE_DATA_ROOT: /var/lib/hive
    volumes:
      - ${HIVE_DATA_ROOT:-.hive-data}:/var/lib/hive
    command:
      - sh
      - -c
      - mkdir -p /var/lib/hive/cas /var/lib/hive/tmp && chown -R hive:hive /var/lib/hive/cas /var/lib/hive/tmp
    networks:
      - hive

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HIVE_ENVIRONMENT: ${HIVE_ENVIRONMENT:-development}
      HIVE_DATA_ROOT: /var/lib/hive
      HIVE_PROJECTS_ROOT: /workspace/projects
      HIVE_EMBEDDING_ENABLED: ${HIVE_EMBEDDING_ENABLED:-false}
      HIVE_EMBEDDING_BASE_URL: ${HIVE_EMBEDDING_BASE_URL:-}
      HIVE_EMBEDDING_MODEL: ${HIVE_EMBEDDING_MODEL:-}
      HIVE_EMBEDDING_MODEL_REVISION: ${HIVE_EMBEDDING_MODEL_REVISION:-}
      HIVE_EMBEDDING_DIMENSIONS: ${HIVE_EMBEDDING_DIMENSIONS:-}
      HIVE_EMBEDDING_API_KEY: ${HIVE_EMBEDDING_API_KEY:-}
      HIVE_EMBEDDING_TIMEOUT_SECONDS: ${HIVE_EMBEDDING_TIMEOUT_SECONDS:-10}
      HIVE_EMBEDDING_BATCH_SIZE: ${HIVE_EMBEDDING_BATCH_SIZE:-16}
      HIVE_EMBEDDING_MAX_INPUT_CHARS: ${HIVE_EMBEDDING_MAX_INPUT_CHARS:-6000}
      HIVE_EMBEDDING_MAX_DIMENSIONS: ${HIVE_EMBEDDING_MAX_DIMENSIONS:-2000}
      HIVE_EMBEDDING_CANDIDATE_POOL: ${HIVE_EMBEDDING_CANDIDATE_POOL:-20}
      HIVE_EMBEDDING_RRF_K: ${HIVE_EMBEDDING_RRF_K:-60}
      HIVE_EMBEDDING_LEXICAL_WEIGHT: ${HIVE_EMBEDDING_LEXICAL_WEIGHT:-1.0}
      HIVE_EMBEDDING_SEMANTIC_WEIGHT: ${HIVE_EMBEDDING_SEMANTIC_WEIGHT:-1.0}
      HIVE_RERANK_ENABLED: ${HIVE_RERANK_ENABLED:-false}
      HIVE_RERANK_BASE_URL: ${HIVE_RERANK_BASE_URL:-}
      HIVE_RERANK_MODEL: ${HIVE_RERANK_MODEL:-}
      HIVE_RERANK_MODEL_REVISION: ${HIVE_RERANK_MODEL_REVISION:-}
      HIVE_RERANK_API_KEY: ${HIVE_RERANK_API_KEY:-}
      HIVE_RERANK_TIMEOUT_SECONDS: ${HIVE_RERANK_TIMEOUT_SECONDS:-10}
      HIVE_RERANK_CANDIDATE_POOL: ${HIVE_RERANK_CANDIDATE_POOL:-20}
      HIVE_RERANK_MAX_DOCUMENT_CHARS: ${HIVE_RERANK_MAX_DOCUMENT_CHARS:-6000}
      HIVE_RERANK_MAX_QUERY_CHARS: ${HIVE_RERANK_MAX_QUERY_CHARS:-512}
      HIVE_RERANK_MAX_RESPONSE_BYTES: ${HIVE_RERANK_MAX_RESPONSE_BYTES:-2000000}
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-hive}:${POSTGRES_PASSWORD:-hive}@postgres:5432/${POSTGRES_DB:-hive}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:${HIVE_DASHBOARD_PORT:-3000},http://127.0.0.1:${HIVE_DASHBOARD_PORT:-3000}
    volumes:
      - ${HIVE_DATA_ROOT:-.hive-data}:/var/lib/hive
      - ${HIVE_PROJECTS_ROOT:-.hive-projects}:/workspace/projects:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${HIVE_API_PORT:-8000}:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')); raise SystemExit(0 if data['status']=='ok' else 1)
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - hive

  dashboard:
    build:
      context: dashboard
      args:
        VITE_API_BASE_URL: http://localhost:${HIVE_API_PORT:-8000}
    ports:
      - 127.0.0.1:${HIVE_DASHBOARD_PORT:-3000}:80
    depends_on:
      api:
        condition: service_healthy
    networks:
      - hive

networks:
  hive:
    driver: bridge
